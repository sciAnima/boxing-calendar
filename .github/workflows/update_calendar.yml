name: Update Boxing Calendar

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * *"   # Runs every day at 08:00 UTC (2 AM Chicago)
  workflow_dispatch:       # Allows manual runs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25    # a normal run takes ~2 minutes; don't let a stuck one hang
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Install Playwright browser
        run: |
          # --with-deps downloads system packages from Ubuntu's mirrors, which occasionally
          # fail to resolve (it burned 10 minutes and failed the 2026-11-11 run). Retry with
          # a per-attempt cap. No fallback to a deps-less install: a half-working browser
          # would make the scraper drop sources and overwrite the calendar with fewer events.
          for attempt in 1 2 3; do
            if timeout 240 python -m playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install failed (attempt $attempt of 3); retrying"
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run scraper
        run: |
          python boxing_scraper.py

      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-raw-html
          path: debug_raw.html

      - name: Commit updated ICS
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add boxing_schedule.ics
          git commit -m "Auto-update boxing schedule" || echo "No changes to commit"

      - name: Push changes
        run: |
          # GitHub occasionally rejects a push with a transient 5xx, and main can move
          # while the scraper runs (e.g. a PR merges). Retry, rebasing onto the latest
          # main each time; on a calendar conflict our freshly generated file wins.
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 4); retrying"
            sleep $((attempt * 10))
            git pull --rebase -X theirs origin main || git rebase --abort || true
          done
          exit 1
